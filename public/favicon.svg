<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Градиент глубокого трюфельного фона -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1613" />
      <stop offset="100%" stop-color="#080605" />
    </radialGradient>

    <!-- Тисненое золото высокой пробы -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Свечение звезды -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Базовый диск со скошенным кантом -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Поварской колпак шефа (Toque Blanche) -->
  <g transform="translate(0, 2)">
    <!-- Складки и купол колпака -->
    <path d="M22 34C18 34 16 30.5 17 27C18 23.5 21 23 23 23.5C23.5 19.5 27 17 32 17C37 17 40.5 19.5 41 23.5C43 23 46 23.5 47 27C48 30.5 46 34 42 34Z" fill="url(#gold)" />
    
    <!-- Теневые акценты складок -->
    <path d="M27 23C27 28 28 33 28 34" stroke="#78350F" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <path d="M32 20C32 26 32 32 32 34" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M37 23C37 28 36 33 36 34" stroke="#78350F" stroke-width="1" stroke-linecap="round" opacity="0.6" />

    <!-- Манжета колпака -->
    <rect x="22" y="34" width="20" height="7" rx="1.5" fill="url(#gold)" />
    <line x1="24" y1="37.5" x2="40" y2="37.5" stroke="#78350F" stroke-width="1" opacity="0.5" />

    <!-- Тарелка-основание -->
    <path d="M15 44C24 47 40 47 49 44" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Золотая искра над колпаком -->
  <path d="M32 7L33.2 11.8L38 13L33.2 14.2L32 19L30.8 14.2L26 13L30.8 11.8Z" fill="#FDE68A" filter="url(#glow)" />
</svg>